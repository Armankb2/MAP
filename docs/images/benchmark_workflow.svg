<?xml version="1.0" encoding="UTF-8"?>
<!-- Benchmark & Reporting Workflow -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" style="background:#0D1117;font-family:Arial,Helvetica,sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Benchmark Executable -->
  <rect x="30" y="30" width="160" height="50" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="110" y="60" fill="#E6EDF3" font-size="12" text-anchor="middle" font-weight="bold">benchmark (C)</text>
  <!-- CSV Output -->
  <rect x="250" y="20" width="180" height="70" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="340" y="45" fill="#6B8FBF" font-size="12" text-anchor="middle" font-weight="bold">CSV Results</text>
  <text x="340" y="65" fill="#E6EDF3" font-size="11" text-anchor="middle">mean, stddev, error</text>
  <!-- Plotting -->
  <rect x="500" y="30" width="150" height="50" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="575" y="60" fill="#5F9E9A" font-size="12" text-anchor="middle" font-weight="bold">plot_results.py</text>
  <!-- DOCX Report -->
  <rect x="720" y="30" width="150" height="50" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="795" y="60" fill="#6B8FBF" font-size="12" text-anchor="middle" font-weight="bold">make_report.py</text>
  <!-- Connections -->
  <path d="M190,55 H250" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430,55 H500" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M650,55 H720" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
