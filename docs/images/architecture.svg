<?xml version="1.0" encoding="UTF-8"?>
<!-- Project Architecture Overview -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" style="background:#0D1117;font-family:Arial,Helvetica,sans-serif;">
  <!-- Boxes -->
  <rect x="30" y="30" width="200" height="80" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="130" y="65" fill="#E6EDF3" font-size="14" text-anchor="middle" font-weight="bold">Data Generation</text>
  <rect x="300" y="30" width="200" height="80" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="400" y="65" fill="#E6EDF3" font-size="14" text-anchor="middle" font-weight="bold">Benchmark Driver</text>
  <rect x="570" y="30" width="200" height="80" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="670" y="65" fill="#E6EDF3" font-size="14" text-anchor="middle" font-weight="bold">Result Processing</text>
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <path d="M230,70 H300" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500,70 H570" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Sub‑components inside Benchmark Driver -->
  <rect x="320" y="120" width="160" height="50" fill="none" stroke="#30363D" stroke-width="1"/>
  <text x="400" y="150" fill="#6B8FBF" font-size="12" text-anchor="middle">K‑Means Variants</text>
  <path d="M400,110 V120" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
