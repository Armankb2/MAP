<?xml version="1.0" encoding="UTF-8"?>
<!-- Parallel Implementation Taxonomy -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" style="background:#0D1117;font-family:Arial,Helvetica,sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Sequential -->
  <rect x="30" y="30" width="180" height="50" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="120" y="60" fill="#E6EDF3" font-size="12" text-anchor="middle" font-weight="bold">Sequential</text>
  <!-- OpenMP variants -->
  <rect x="250" y="30" width="180" height="150" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="340" y="55" fill="#6B8FBF" font-size="12" text-anchor="middle" font-weight="bold">OpenMP</text>
  <text x="340" y="85" fill="#E6EDF3" font-size="11" text-anchor="middle">Private Accumulator</text>
  <text x="340" y="115" fill="#E6EDF3" font-size="11" text-anchor="middle">Atomic Updates</text>
  <text x="340" y="145" fill="#E6EDF3" font-size="11" text-anchor="middle">Critical Section</text>
  <!-- SIMD -->
  <rect x="480" y="30" width="180" height="50" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="570" y="60" fill="#5F9E9A" font-size="12" text-anchor="middle" font-weight="bold">SIMD (ARM NEON)</text>
  <!-- AoS / SoA -->
  <rect x="710" y="30" width="180" height="50" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="800" y="60" fill="#6B8FBF" font-size="12" text-anchor="middle" font-weight="bold">AoS vs SoA</text>
  <!-- Pthreads -->
  <rect x="480" y="120" width="180" height="50" fill="none" stroke="#30363D" stroke-width="2"/>
  <text x="570" y="150" fill="#5F9E9A" font-size="12" text-anchor="middle" font-weight="bold">POSIX Pthreads</text>
  <!-- Arrows -->
  <path d="M210,55 H250" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M660,55 H710" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M570,80 V120" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
